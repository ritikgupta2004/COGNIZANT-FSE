<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - CSS Inclusion Methods</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Internal CSS -->
    <style>
        body {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="color: red;">Local Community Event Portal</h1>

    <h2>Upcoming Events</h2>

    <p>Welcome to the Local Community Event Portal.</p>

    <div class="eventCard">
        <h3>Music Festival</h3>
        <p>Enjoy live music with local artists this weekend.</p>
    </div>

    <div class="eventCard">
        <h3>Food Carnival</h3>
        <p>Experience delicious food from different cuisines.</p>
    </div>

</body>
</html>
